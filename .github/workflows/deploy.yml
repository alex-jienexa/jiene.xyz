name: Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ENV_FILE
          script: |
            set -e
            cd /var/www/jiene.xyz
            git pull origin main

            cat << 'EOF' > .env
            $ {{ secrets.ENV_FILE }}
            EOF
            
            chmod +x create_caddyfile.sh
            ./create_caddyfile.sh
            
            docker compose down
            docker compose up -d --build
